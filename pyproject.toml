[tool.black]
line-length = 88
target-version = ["py313"]
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py313"
select = ["E", "F", "I", "N", "W", "B", "UP"]
ignore  = ["E501"]

[tool.ruff.per-file-ignores]
"backend/tests/*" = ["S101"]

[tool.mypy]
python_version      = "3.13"
strict              = true
ignore_missing_imports = true
pretty              = true

[tool.pytest.ini_options]
testpaths    = ["backend/tests"]
pythonpath   = ["backend"]
asyncio_mode = "auto"
addopts      = "-v --cov=src --cov-report=term-missing --cov-report=xml"
filterwarnings = [
    "ignore::DeprecationWarning:mangum.*",
]
