[tool.black]
line-length = 88
target-version = ["py313"]
include = '\.pyi?$'

[tool.ruff]
line-length    = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S101"]

[tool.mypy]
python_version         = "3.13"
plugins                = ["pydantic.mypy"]
strict                 = true
ignore_missing_imports = true
disallow_untyped_decorators = false   # AWS Powertools decorators are untyped
pretty                 = true

[tool.pydantic-mypy]
init_forbid_extra             = false
init_typed                    = true
warn_required_dynamic_aliases = false

[tool.pytest.ini_options]
testpaths    = ["backend/tests"]
pythonpath   = ["backend"]
asyncio_mode = "auto"
addopts      = "-v --cov=src --cov-report=term-missing --cov-report=xml"
filterwarnings = [
    "ignore::DeprecationWarning:mangum.*",
]
